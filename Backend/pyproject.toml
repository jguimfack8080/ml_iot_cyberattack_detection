[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.backends.legacy:build"

[project]
name = "ml-iot-cyberattack-detection"
version = "0.1.0"
description = "Hierarchical Gradient Boosting + SHAP for IoT Intrusion Detection on CICIoT2023"
authors = [{ name = "Jordan Guimfack Jeuna", email = "jeunaj3@gmail.com" }]
requires-python = ">=3.10"
dependencies = [
    "pandas>=2.0",
    "numpy>=1.24",
    "scikit-learn>=1.3",
    "xgboost>=2.0",
    "shap>=0.44",
    "matplotlib>=3.7",
    "seaborn>=0.12",
    "joblib>=1.3",
    "python-dotenv>=1.0",
    "tqdm>=4.65",
]

[project.optional-dependencies]
dev = ["pytest>=7.4", "pytest-cov>=4.1"]

[project.scripts]
iot-ids = "src.main:main"

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "--cov=src --cov-report=term-missing"

[tool.setuptools.packages.find]
where = ["."]
include = ["src*"]
